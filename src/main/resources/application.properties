spring.application.name=battlegame
# PORT env variable is used by most cloud hosting platforms
server.port=${PORT:8080}

# In-memory database - data is reset on every restart
spring.datasource.url=jdbc:h2:mem:battlegame
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
